# fly.toml app configuration file generated for nedai-desktop on 2026-05-11T23:30:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nedai-desktop'
primary_region = 'jnb'

[build]

[deploy]
  release_command = 'bunx prisma migrate deploy'

[env]
  APP_URL = 'https://nedai-desktop-server.fly.dev'
  EMBEDDING_PROVIDER = 'local'
  PORT = '3000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
